name: domino_score
description: "Dominó Score - Control de puntuaciones móvil en Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  # withValues() (usado en la UI) requiere Flutter 3.27 / Dart 3.6.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
