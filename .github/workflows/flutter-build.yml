name: Flutter Build & Deploy (Android APK & Web)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias y pruebas
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Compilar APK Android (Release)
        run: flutter build apk --release

      - name: Subir Instalador APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: domino-score-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-web:
    name: Compilar Versión Web & Desplegar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Flutter Web
        run: flutter build web --release --base-href "/domino-score/"

      - name: Subir Artefacto Web
        uses: actions/upload-artifact@v4
        with:
          name: domino-score-web
          path: build/web
          if-no-files-found: error
          retention-days: 30

      - name: Desplegar a GitHub Pages (Rama gh-pages)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
